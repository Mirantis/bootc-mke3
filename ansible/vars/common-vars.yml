# Optional Docker daemon configuration. The variable can be either file path or the Docker Daemon json content itself
docker_daemon_config_src: ""

# Optional Docker daemon configuration file path on remote hosts
docker_daemon_config_dst: "/etc/docker/daemon.json"
# Source of the MKE config file. Config example ref:
# https://docs.mirantis.com/mke/3.7/ops/administer-cluster/configure-an-mke-cluster/use-an-mke-configuration-file.html
mke_config_src: ""

# THE MCR license value
mcr_license: ""

# The MKE license value
mke_license: ""

# MKE Installation flags
# https://docs.mirantis.com/mke/3.7/cli-ref/mke-cli-install.html
mke_install_flags:
  [
    '--san="{{ mke_url }}"',
    '--default-node-orchestrator="kubernetes"',
    '--nodeport-range="32768-35535"',
    "--force-minimums",
  ]

# When true, `mke install` is run with --calico-datastore-type-kdd, switching
# Calico's datastore backend from etcd to the Kubernetes API (KDD).
#
# Known MKE3 issue: with KDD enabled, MKE brings up the
# calico-kube-controllers Deployment (kube-system) still wired to the
# calico-node ServiceAccount instead of the calico-kube-controllers
# ServiceAccount it also creates — calico-node's RBAC is scoped for the node
# agent, not the controller, so the pod cannot sync from the Kubernetes API.
# tasks/calico-kdd-patch-tasks.yml (run from mke-post-install-playbook.yml)
# patches the Deployment's serviceAccountName once the cluster is up. Keep
# this var and that task's `when` in sync if you flip this.
#
# NOTE: MKE team engineers don't recommend to use KDD by default, because
# it is not yet fully hardened from a product perspective
calico_datastore_type_kdd: false

# Use your own TLS certificate for the MKE web server/API instead of the
# self-signed certificate MKE generates. Applied only at install time, via
# `--external-server-cert` (tasks/mke-external-certs-tasks.yml populates the
# ucp-controller-server-certs volume before install runs). Changing this
# after MKE is already installed does NOT rotate the live certificate --
# that requires the MKE web UI (Admin Settings > Certificates) per Mirantis
# docs, or a fresh install.
#
# This is unrelated to mke_custom_ca_*_enabled (vars/mke-custom-ca-vars.yml),
# which replaces MKE's internal Cluster/etcd/Client root CAs, not the
# web-facing server certificate.
#
# Ref: https://docs.mirantis.com/mke/3.9/install/predeployment/use-ext-ca.html
# Ref: https://docs.mirantis.com/mke/3.9/cli-ref/mke-cli-install.html
mke_external_certs_enabled: false

# ca.pem / cert.pem / key.pem for the MKE web server certificate. Each
# accepts either a path to a file on the Ansible controller or the literal
# PEM content itself (same "path or content" convention as
# docker_daemon_config_src below). cert.pem MUST already include SANs for
# mke_url and any load balancer address used to reach MKE -- MKE does not
# add SANs to a certificate you supply. A single shared cert/key is copied
# to every manager; MKE auto-propagates it to managers that join or get
# promoted later. Ignored unless mke_external_certs_enabled is true.
mke_external_ca_src: ""
mke_external_cert_src: ""
mke_external_key_src: ""

# The appointed manager node used as a lead node
main_manager: "{{ groups['managers'][0] }}"


# When true, sshd is stopped and disabled on every host at the end of the operation.
# Set to true only in environments where SSH access must be revoked post-install.
disable_sshd_after_install: true

# When true, sudo privileges are revoked from ansible_user on every host after
# MKE installation and before sshd is disabled. Covers wheel group (RHEL/bootc),
# sudo group (Debian/Ubuntu), and any named /etc/sudoers.d/<ansible_user> drop-in.
revoke_sudo_after_install: true

# When true, firewalld is stopped and disabled on every host instead of opening
# individual ports. Use in environments where the network perimeter is managed
# externally and a host-level firewall adds no value or causes interference.
# When false (default), the standard per-service port rules are applied via firewalld.
disable_firewalld: false

# When true, the System Upgrade Controller (SUC) is deployed to the cluster
# before cluster-upgrade-controller. Required when spec.os or spec.product.type=mke4
# is used in a ClusterUpgrade CR.
# Ref: https://github.com/rancher/system-upgrade-controller
deploy_suc: true

# SUC CRD and controller manifest sources, applied via `kubectl apply -f`.
# Accepts a URL or a local file path resolved on the Ansible controller
# (delegate_to: localhost) — use an absolute path or "{{ playbook_dir }}/..."
# rather than a bare relative path.
#
# Defaults point at the copies tasks/fetch-controller-manifests-tasks.yml
# pulls down from a cluster node's /usr/share/mke-controllers/manifests/ (the
# literal, unmodified upstream release assets bootc-mirantis staged into the
# image at build time — not templates, the SUC image tag is already baked
# into system-upgrade-controller.yaml's Deployment spec). Using the
# node-fetched copy means the installed SUC version always matches what is
# actually cached on the nodes, with no separate version fact in Ansible
# that could drift from it and break air-gapped installs.
#
# Override to a URL or a different local/mirrored copy in two cases:
#   1. You deliberately want a SUC version other than the one preloaded on
#      this image build (accepts the tradeoff of an online pull, or air-gap
#      it yourself).
#   2. mke-post-install-playbook.yml is being run standalone/disconnected
#      from mke-install-playbook.yml (its own header documents this as a
#      supported flow) — the node-fetched defaults above only exist on the
#      controller that ran mke-install-playbook.yml in the same
#      playbook_dir. Point these at a URL or a path reachable from
#      wherever post-install actually runs.
suc_crd_manifest_src: "{{ playbook_dir }}/mke-bundle/controller-manifests/system-upgrade-controller-crd.yaml"
suc_controller_manifest_src: "{{ playbook_dir }}/mke-bundle/controller-manifests/system-upgrade-controller.yaml"

# Service account granted the 'privileged' pod-security attribute in the MKE
# UCPAuthorization allowlist when deploy_suc is true. Format: namespace:name.
suc_service_account: "system-upgrade:system-upgrade"


# When true, the cluster-upgrade-controller is installed on the cluster.
deploy_cluster_upgrade_controller: true

# cluster-upgrade-controller manifest source, applied via `kubectl apply -f`.
# Accepts a URL or a local file path resolved on the Ansible controller
# (delegate_to: localhost) — use an absolute path or "{{ playbook_dir }}/..."
# rather than a bare relative path.
#
# Default points at the copy tasks/fetch-cluster-upgrade-controller-manifest-tasks.yml
# pulls down from a cluster node's /usr/share/mke-controllers/manifests/ (a
# plain Kubernetes manifest — `helm template ... --namespace mke
# --include-crds` rendered once by bootc-mirantis at image-build time, not
# a live Helm release). Using the node-fetched copy means the installed
# controller version always matches what is actually cached on the nodes,
# with no separate version fact in Ansible that could drift from it — and
# no dependency on registry.mirantis.com being reachable.
#
# Override to a URL or a different local/mirrored copy in two cases:
#   1. You deliberately want a controller version other than the one
#      preloaded on this image build (accepts the tradeoff of an online
#      pull, or air-gap it yourself).
#   2. mke-post-install-playbook.yml is being run standalone/disconnected
#      from mke-install-playbook.yml (its own header documents this as a
#      supported flow) — the node-fetched default above only exists on the
#      controller that ran mke-install-playbook.yml in the same
#      playbook_dir. Point this at a URL or a path reachable from wherever
#      post-install actually runs.
cluster_upgrade_controller_manifest: "{{ playbook_dir }}/mke-bundle/controller-manifests/cluster-upgrade-controller-manifest.yaml"

# Namespace the manifest's resources are rendered for; pre-created (if
# absent) before the manifest is applied, since `kubectl apply` never
# creates a namespace on its own.
cluster_upgrade_controller_namespace: "mke"

# When true, the machine-config-controller is installed on the cluster.
deploy_machine_config_controller: true

# machine-config-controller manifest source, applied via `kubectl apply -f`.
# Accepts a URL or a local file path resolved on the Ansible controller
# (delegate_to: localhost) — use an absolute path or "{{ playbook_dir }}/..."
# rather than a bare relative path.
#
# Default points at the copy tasks/fetch-machine-config-controller-manifest-tasks.yml
# pulls down from a cluster node's /usr/share/mke-controllers/manifests/ (a
# plain Kubernetes manifest — `helm template ... --namespace mke
# --include-crds` rendered once by bootc-mirantis at image-build time, not
# a live Helm release). Using the node-fetched copy means the installed
# controller version always matches what is actually cached on the nodes,
# with no separate version fact in Ansible that could drift from it — and
# no dependency on registry.mirantis.com being reachable.
#
# Override to a URL or a different local/mirrored copy in two cases:
#   1. You deliberately want a controller version other than the one
#      preloaded on this image build (accepts the tradeoff of an online
#      pull, or air-gap it yourself).
#   2. mke-post-install-playbook.yml is being run standalone/disconnected
#      from mke-install-playbook.yml (its own header documents this as a
#      supported flow) — the node-fetched default above only exists on the
#      controller that ran mke-install-playbook.yml in the same
#      playbook_dir. Point this at a URL or a path reachable from wherever
#      post-install actually runs.
machine_config_controller_manifest: "{{ playbook_dir }}/mke-bundle/controller-manifests/machine-config-controller-manifest.yaml"

# Namespace pre-created (if absent) before the manifest is applied, since
# `kubectl apply` never creates a namespace on its own. Note: the chart
# this manifest was rendered from hardcodes its Deployment's own namespace
# to "system-upgrade" internally regardless of this value — the pod lands
# there, not here. Kept for parity with cluster-upgrade-controller and
# because other resources in the manifest (e.g. CRDs are cluster-scoped,
# but any namespaced non-Deployment resource) still render into this one.
machine_config_controller_namespace: "mke"

# Post-installation MKE configuration that requires no SSH access to cluster nodes.
#
# All operations run on the Ansible controller (hosts: localhost) and interact
# with the cluster exclusively through the MKE REST API and the Kubernetes API.
# This playbook can therefore be run independently after SSH has been disabled.
#
# Caveat: suc_crd_manifest_src/suc_controller_manifest_src (vars/common-vars.yml)
# default to files fetched from a cluster node during mke-install-playbook.yml
# and left on this controller under playbook_dir/mke-bundle/. If running this
# playbook standalone from a different controller/directory than the one that
# ran install, those defaults will not resolve — override both vars to a URL
# or a path reachable from wherever this actually runs.
#
# Usage:
#   ansible-playbook mke-post-install-playbook.yml
#
# To override the local bundle directory:
#   ansible-playbook mke-post-install-playbook.yml -e bundle_dest=/tmp/my-bundle

- name: Install cluster-upgrade-controller
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/common-vars.yml
    - vars/mke-creds.yml
  vars:
    # mke_url lives in inventory all.vars; pull it from a real host's hostvars
    # since localhost is not part of the inventory group.
    mke_url: "{{ hostvars[groups['managers'][0]]['mke_url'] }}"
    bundle_dest: "{{ playbook_dir }}/mke-bundle"
  tasks:
    - name: Install cluster-upgrade-controller
      ansible.builtin.include_tasks: tasks/cluster-upgrade-controller-tasks.yml

- name: Install machine-config-controller
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/common-vars.yml
    - vars/mke-creds.yml
  vars:
    # mke_url lives in inventory all.vars; pull it from a real host's hostvars
    # since localhost is not part of the inventory group.
    mke_url: "{{ hostvars[groups['managers'][0]]['mke_url'] }}"
    bundle_dest: "{{ playbook_dir }}/mke-bundle"
  tasks:
    - name: Install machine-config-controller
      ansible.builtin.include_tasks: tasks/machine-config-controller-tasks.yml

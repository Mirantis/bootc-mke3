# Distributes container registry credentials to all hosts.
#
# Reads vars/reg-creds from the Ansible controller and, for each entry, runs
# `docker login` on the remote host (so docker run/service/swarm pulls
# authenticate) and writes /etc/ostree/auth.json — base64(username:password)
# per registry, in the format described by containers-auth.json(5) — so
# bootc/ostree pulls of the host OS image authenticate too:
# https://github.com/containers/image/blob/main/docs/containers-auth.json.5.md
#
# Usage:
#   ansible-playbook reg-creds-playbook.yml
#
# To target a subset of hosts:
#   ansible-playbook reg-creds-playbook.yml --limit managers

- name: Configure container registry authentication
  hosts: all
  gather_facts: false
  tasks:
    - name: Configure private registry credentials
      ansible.builtin.include_tasks: tasks/private-reg-creds-tasks.yml

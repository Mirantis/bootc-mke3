# Installs the machine-config-controller using the MKE3 client bundle
# kubeconfig.
#
# Steps:
#   1. Fetch and extract the client bundle (kube.yml is the kubeconfig).
#      Skipped when mke_client_bundle_fetched is already true — normally set
#      by cluster-upgrade-controller-tasks.yml, which runs first in
#      mke-post-install-playbook.yml against the same hosts: localhost host.
#   2. Ensure the target namespace exists — `kubectl apply` never creates
#      one on its own, unlike `helm upgrade --install --create-namespace`.
#   3. Apply the static machine-config-controller manifest when
#      deploy_machine_config_controller is true — from the node-fetched
#      local copy (default) or a URL/mirrored path (see
#      tasks/fetch-machine-config-controller-manifest-tasks.yml). The
#      manifest was rendered with `--include-crds`, so `kubectl apply`
#      keeps its CRDs in sync on every run — no separate CRD-apply step
#      needed, unlike a Helm release (which never touches an
#      already-installed chart's CRDs on upgrade).
#
# Required vars (inherited from the enclosing play):
#   admin_user  – MKE administrator username       (from vars/mke-creds.yml)
#   admin_pass  – MKE administrator password       (from vars/mke-creds.yml)
#   mke_url     – MKE load-balancer IP/hostname    (from inventory all.vars)
#   bundle_dest – local directory for the bundle   (default: playbook_dir/mke-bundle)
#   deploy_machine_config_controller    – when true, installs machine-config-controller (from vars/common-vars.yml)
#   machine_config_controller_manifest  – node-fetched static manifest path, or a URL/mirrored path
#   machine_config_controller_namespace – namespace to pre-create before applying (created if absent)
#
# Ref: https://github.com/Mirantis/machine-config-controller

- name: Fetch MKE client bundle
  ansible.builtin.include_tasks: tasks/mke-client-bundle-tasks.yml
  when: deploy_machine_config_controller | bool and not (mke_client_bundle_fetched | default(false))

- name: Ensure machine-config-controller namespace exists
  ansible.builtin.shell: >-
    kubectl create namespace {{ machine_config_controller_namespace }}
    --kubeconfig {{ bundle_dest }}/kube.yml --dry-run=client -o yaml
    | kubectl apply --kubeconfig {{ bundle_dest }}/kube.yml -f -
  when: deploy_machine_config_controller | bool
  delegate_to: localhost
  run_once: true
  register: _mcc_ns_apply
  changed_when: "'created' in _mcc_ns_apply.stdout"

- name: Install machine-config-controller from static manifest
  ansible.builtin.command: >-
    kubectl apply --kubeconfig {{ bundle_dest }}/kube.yml -f {{ machine_config_controller_manifest }}
  when: deploy_machine_config_controller | bool
  delegate_to: localhost
  run_once: true
  register: _mcc_apply
  changed_when: "'configured' in _mcc_apply.stdout or 'created' in _mcc_apply.stdout"

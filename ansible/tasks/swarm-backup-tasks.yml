- name: Create backup directory
  ansible.builtin.file:
    path: "{{ mke_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Stop docker service
  ansible.builtin.systemd_service:
    name: docker
    state: stopped
  when: swarm_status.stdout == "active"
  become: true

- name: Backup Swarm directory  # noqa: command-instead-of-module - no core module creates tar archives; unarchive only extracts
  ansible.builtin.command:
    argv:
      - tar
      - -cvzf
      - "{{ swarm_backup_filename }}"
      - /var/lib/docker/swarm/
  become: true

- name: Start docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
  become: true

- name: Restrict Swarm backup to root
  ansible.builtin.file:
    path: "{{ swarm_backup_filename }}"
    owner: root
    group: root
    mode: "0600"
  become: true

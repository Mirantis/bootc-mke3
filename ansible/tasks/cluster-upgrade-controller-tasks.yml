# Installs the cluster-upgrade-controller using the MKE3 client bundle kubeconfig.
#
# Steps:
#   1. Fetch and extract the client bundle (kube.yml is the kubeconfig).
#   2. Deploy System Upgrade Controller (SUC) when deploy_suc is true.
#   3. Patch SUC deployment with node affinity so it schedules only on
#      control-plane / master nodes running Linux.
#   4. Patch SUC ConfigMap to extend the job active deadline to 3600 s,
#      then roll the SUC deployment when that patch actually changed
#      anything — envFrom ConfigMaps are not live-reloaded by Kubernetes,
#      so the pod must restart to pick up the new value.
#   5. Grant system-upgrade-controller service account the privileged attribute
#      in MKE cluster config when deploy_suc is true (UCPAuthorization allowlist).
#   6. Apply the static cluster-upgrade-controller manifest (pre-creating its
#      namespace first, since `kubectl apply` never creates one on its own)
#      when deploy_cluster_upgrade_controller is true — from the node-fetched
#      local copy (default) or a URL/mirrored path (see
#      tasks/fetch-cluster-upgrade-controller-manifest-tasks.yml).
#
# Required vars (inherited from the enclosing play):
#   admin_user  – MKE administrator username       (from vars/mke-creds.yml)
#   admin_pass  – MKE administrator password       (from vars/mke-creds.yml)
#   mke_url     – MKE load-balancer IP/hostname    (from inventory all.vars)
#   bundle_dest – local directory for the bundle   (default: playbook_dir/mke-bundle)
#   deploy_suc  – when true, SUC is deployed before cluster-upgrade-controller (from vars/common-vars.yml)
#   suc_crd_manifest_src        – SUC CRD manifest URL or local path (from vars/common-vars.yml)
#   suc_controller_manifest_src – SUC controller manifest URL or local path (from vars/common-vars.yml)
#   deploy_cluster_upgrade_controller    – when true, installs cluster-upgrade-controller (from vars/common-vars.yml)
#   cluster_upgrade_controller_manifest  – node-fetched static manifest path, or a URL/mirrored path
#   cluster_upgrade_controller_namespace – namespace to pre-create before applying (created if absent)
#
# Ref: https://github.com/Mirantis/cluster-upgrade-controller#install-the-controller
# Ref: https://github.com/rancher/system-upgrade-controller

- ansible.builtin.include_tasks: tasks/mke-client-bundle-tasks.yml
  when: deploy_suc | bool or deploy_cluster_upgrade_controller | bool

- name: Deploy System Upgrade Controller (SUC)
  ansible.builtin.command: >-
    kubectl apply --kubeconfig {{ bundle_dest }}/kube.yml -f {{ item }}
  loop:
    - "{{ suc_crd_manifest_src }}"
    - "{{ suc_controller_manifest_src }}"
  when: deploy_suc | bool
  delegate_to: localhost
  run_once: true
  changed_when: "'configured' in _suc_apply.stdout or 'created' in _suc_apply.stdout"
  register: _suc_apply

- name: Patch SUC deployment with control-plane node affinity
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - deployment
      - system-upgrade-controller
      - -n
      - system-upgrade
      - --kubeconfig
      - "{{ bundle_dest }}/kube.yml"
      - --type
      - merge
      - --patch
      - "{{ _suc_node_affinity_patch | to_json }}"
  vars:
    _suc_node_affinity_patch:
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
                        - key: kubernetes.io/os
                          operator: In
                          values: [linux]
                    - matchExpressions:
                        - key: node-role.kubernetes.io/master
                          operator: Exists
                        - key: kubernetes.io/os
                          operator: In
                          values: [linux]
  when: deploy_suc | bool
  delegate_to: localhost
  run_once: true
  register: _suc_patch
  changed_when: "'patched' in _suc_patch.stdout"

- name: Patch SUC ConfigMap to extend job active deadline
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - configmap
      - default-controller-env
      - -n
      - system-upgrade
      - --kubeconfig
      - "{{ bundle_dest }}/kube.yml"
      - --type
      - merge
      - --patch
      - '{"data":{"SYSTEM_UPGRADE_JOB_ACTIVE_DEADLINE_SECONDS":"3600"}}'
  when: deploy_suc | bool
  delegate_to: localhost
  run_once: true
  register: _suc_configmap_patch
  changed_when: "'patched' in _suc_configmap_patch.stdout"

# The controller consumes default-controller-env via envFrom, and
# Kubernetes never restarts a running pod when a ConfigMap it references
# via envFrom changes — the patch above would otherwise sit inert until
# the pod happened to restart for an unrelated reason (node drain,
# eviction, manual delete, ...). Roll the deployment only when the patch
# above actually changed the data, so this stays idempotent (no restart
# on unchanged reruns) while still guaranteeing the new deadline is
# picked up immediately when it is changed.
- name: Restart SUC deployment to pick up ConfigMap change
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - restart
      - deployment
      - system-upgrade-controller
      - -n
      - system-upgrade
      - --kubeconfig
      - "{{ bundle_dest }}/kube.yml"
  when: deploy_suc | bool and _suc_configmap_patch.changed
  delegate_to: localhost
  run_once: true
  changed_when: true


- ansible.builtin.include_tasks: tasks/suc-priv-grant-tasks.yml
  when: deploy_suc | bool
- name: Ensure cluster-upgrade-controller namespace exists
  ansible.builtin.shell: >-
    kubectl create namespace {{ cluster_upgrade_controller_namespace }}
    --kubeconfig {{ bundle_dest }}/kube.yml --dry-run=client -o yaml
    | kubectl apply --kubeconfig {{ bundle_dest }}/kube.yml -f -
  when: deploy_cluster_upgrade_controller | bool
  delegate_to: localhost
  run_once: true
  register: _cuc_ns_apply
  changed_when: "'created' in _cuc_ns_apply.stdout"

# --namespace is required here: the chart's Deployment/ServiceAccount
# templates never set metadata.namespace (only the ClusterRoleBinding's
# subjects[].namespace references .Release.Namespace) — `helm install`
# gets away with this because Helm's client force-places every object
# into the release namespace regardless of what the YAML says, but plain
# `kubectl apply` honors only what's in the manifest and otherwise falls
# back to the kubeconfig context's default namespace ("default" here).
# Without this flag the ServiceAccount/Deployment land in "default" while
# the ClusterRoleBinding still points at a ServiceAccount in "mke" that
# was never created there.
- name: Install cluster-upgrade-controller from static manifest
  ansible.builtin.command: >-
    kubectl apply --kubeconfig {{ bundle_dest }}/kube.yml
    --namespace {{ cluster_upgrade_controller_namespace }}
    -f {{ cluster_upgrade_controller_manifest }}
  when: deploy_cluster_upgrade_controller | bool
  delegate_to: localhost
  run_once: true
  register: _cuc_apply
  changed_when: "'configured' in _cuc_apply.stdout or 'created' in _cuc_apply.stdout"

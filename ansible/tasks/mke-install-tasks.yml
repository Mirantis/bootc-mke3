- name: Get Swarm status
  ansible.builtin.include_tasks: tasks/helpers/swarm_status.yml

- name: Check if MKE is installed
  ansible.builtin.command: docker ps -f name=ucp- -q
  register: mke_installed
  run_once: true

- name: Append the --license MKE flag to the list
  ansible.builtin.set_fact:
    mke_install_flags: "{{ mke_install_flags + ['--license=' ~ mke_license] }}"
  when: mke_license != ""
  run_once: true

- name: Append the --external-server-cert MKE flag to the list
  ansible.builtin.set_fact:
    mke_install_flags: "{{ mke_install_flags + ['--external-server-cert'] }}"
  when: mke_external_certs_enabled | bool
  run_once: true

- name: Append the --calico-datastore-type-kdd MKE flag to the list
  ansible.builtin.set_fact:
    mke_install_flags: "{{ mke_install_flags + ['--calico-datastore-type-kdd'] }}"
  when: calico_datastore_type_kdd | bool
  run_once: true

- name: Get target MKE version
  ansible.builtin.include_tasks: tasks/helpers/get_target_mke_version.yml

- name: Install MKE
  ansible.builtin.command: >
    docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock
    mirantis/ucp:{{ target_mke_version.stdout }} install --admin-username {{ admin_user }} --admin-password {{ admin_pass }}
    {{ mke_install_flags | join(' ') }}

  when: swarm_status.stdout == 'active' and mke_installed.stdout | length == 0
  run_once: true

- name: Get MKE status
  ansible.builtin.include_tasks: tasks/helpers/mke_status.yml
- name: Remove MKE Docker config object
  ansible.builtin.include_tasks: tasks/helpers/remove_mke_docker_config.yml

# Fetched here (not in mke-post-install-playbook.yml) because this play
# still has SSH access to the nodes; post-install may run after sshd/sudo
# have been revoked.
- name: Fetch controller manifests
  ansible.builtin.include_tasks: tasks/fetch-controller-manifests-tasks.yml
- name: Fetch cluster-upgrade-controller manifest
  ansible.builtin.include_tasks: tasks/fetch-cluster-upgrade-controller-manifest-tasks.yml
- name: Fetch machine-config-controller manifest
  ansible.builtin.include_tasks: tasks/fetch-machine-config-controller-manifest-tasks.yml

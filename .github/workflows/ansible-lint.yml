name: Ansible Lint

# Blocking: runs on every PR touching ansible/ content and fails the PR on any
# finding at the `basic` profile (see .ansible-lint). The tree passes clean —
# 0 failures, 0 warnings — so any failure here is a regression introduced by
# the PR under test.
on:
  pull_request:
    paths:
      - "ansible/**"
      - ".ansible-lint"
      - ".github/workflows/ansible-lint.yml"
  workflow_dispatch: {}

# Least privilege: the job only needs to read the repo contents.
permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint==26.8.0

      - name: Run ansible-lint
        run: ansible-lint ansible/

name: Ansible Lint

# Advisory only (PRODENG-3661): runs on every PR touching ansible/ content and
# reports findings in the job log, but `continue-on-error` on the lint step
# means this check never fails a PR. The ansible/ tree has a 127-finding
# backlog at the `basic` profile (see .ansible-lint); promote this to a
# required, blocking check once that backlog is worked down.
on:
  pull_request:
    paths:
      - "ansible/**"
      - ".ansible-lint"
      - ".github/workflows/ansible-lint.yml"
  workflow_dispatch: {}

# Least privilege: the job only needs to read the repo contents.
permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint==26.8.0

      - name: Run ansible-lint (advisory)
        id: lint
        continue-on-error: true
        run: ansible-lint ansible/

      - name: Report advisory status
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "::warning::ansible-lint found issues (see job log) — advisory only, not blocking this PR."
          fi

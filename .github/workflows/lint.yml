name: Lint

# Blocking checks for shell scripts (ShellCheck) and YAML (yamllint). Config
# lives in .shellcheckrc and .yamllint at the repo root; reproduce locally with
# the same commands the steps below run (see CONTRIBUTING.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: the jobs only need to read the repo contents.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest. Scripts are discovered
      # from tracked files: any *.sh/*.bash, plus extensionless files whose
      # first line is a shell shebang. Only errors and warnings fail; info and
      # style notes are advisory.
      - name: ShellCheck
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do
            case "$f" in
              *.sh|*.bash) files+=("$f") ;;
              *)
                if [ -f "$f" ] && [ ! -L "$f" ] \
                  && head -c 128 "$f" | head -n 1 | grep -aqE '^#!.*[/ ](ba|da|k)?sh( |$)'; then
                  files+=("$f")
                fi
                ;;
            esac
          done < <(git ls-files)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No shell scripts found; nothing to lint."
            exit 0
          fi
          printf 'Checking %d shell script(s)\n' "${#files[@]}"
          shellcheck --severity=warning "${files[@]}"

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      # Errors fail the job; warnings (see .yamllint) are reported only.
      - name: Run yamllint
        run: yamllint .
